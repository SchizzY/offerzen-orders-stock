[project]
name = "mrd-orders"
version = "0.1.0"
description = "Orders & Stock core flow: FastAPI, Postgres, Valkey"
requires-python = ">=3.12,<4.0"
dependencies = ["fastapi (>=0.165.0,<0.166.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "sqlalchemy[asyncio] (>=2.1.9,<3.0.0)", "asyncpg (>=0.32.0,<0.33.0)", "alembic (>=1.20.1,<2.0.0)", "pydantic (>=2.14.4,<3.0.0)", "pydantic-settings (>=2.16.3,<3.0.0)", "redis (>=8.1.0,<9.0.0)", "loguru (>=0.8.0,<0.9.0)", "httpx (>=0.28.1,<0.29.0)"]

[tool.poetry]
requires-poetry = ">=2.2"
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "ruff (>=0.17.6,<0.18.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
